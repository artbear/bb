name: Build BB server

on:
  push:
    branches: ['**']
  pull_request:
    branches: [artur-bb]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artbear-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'artbear/bb' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build server, web UI, host daemon and bundled plugins
        run: pnpm exec turbo run build --filter=bb-app --concurrency=2 --output-logs=errors-only
      - name: Install and smoke-test the packaged server
        run: |
          mkdir "$RUNNER_TEMP/bb-artifact"
          node packages/bb-app/scripts/smoke-tarball.mjs "$RUNNER_TEMP/bb-artifact"
      - name: Record build inputs and checksum
        id: pack
        shell: bash
        run: |
          version="$(node -p 'require("./packages/bb-app/package.json").version')"
          sdk="$(node -p 'require("./packages/plugin-sdk/package.json").version')"
          archive="bb-app-$version.tgz"
          commit="$(git rev-parse HEAD)"
          lock_sha="$(sha256sum pnpm-lock.yaml | cut -d ' ' -f 1)"
          node_version="$(node --version)"
          pnpm_version="$(pnpm --version)"
          cd "$RUNNER_TEMP/bb-artifact"
          sha256sum "$archive" > SHA256SUMS
          printf '%s\n' "repository=$GITHUB_REPOSITORY" "commit=$commit" "ref=$GITHUB_REF" \
            "version=$version" "plugin_sdk=$sdk" "node=$node_version" "pnpm=$pnpm_version" \
            "pnpm_lock_sha256=$lock_sha" "platform=linux-x64" > BUILD
          echo "name=bb-app-$version-linux-x64-$commit" >> "$GITHUB_OUTPUT"
      - name: Upload tested npm archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.pack.outputs.name }}
          path: ${{ runner.temp }}/bb-artifact/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
